 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Through My Frames</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>


    <!-- HEADER -->

    <header class="site-header">

        <a class="brand" href="index.html">
            throughmyframes
        </a>


        <button class="theme-btn" id="themeBtn" type="button">
            🌙 Dark Mode
        </button>

    </header>


    <main>


        <!-- PAGE HEADING -->

        <section class="page-heading">

            <p class="eyebrow">
                A collection of moments
            </p>


            <h1>
                Gallery
            </h1>


            <p>
                Moments that shaped my journey, one frame at a time.
            </p>

        </section>


        <!-- NAVBAR -->

        <nav class="navbar" aria-label="Main navigation">

            <a href="index.html">
                Home
            </a>


            <a href="about.html">
                About
            </a>


            <a class="active" href="gallery.html">
                Gallery
            </a>


            <a href="contact.html">
                Contact
            </a>

        </nav>


         

 


         


 <!-- SEARCH -->

<div class="gallery-search">

    <input
        type="search"
        id="gallerySearch"
        placeholder="Search your frames..."
    >

</div>

<!-- FILTERS -->


       <div class="gallery-filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="travel">Travel</button>
    <button class="filter-btn" data-filter="people">People</button>
    <button class="filter-btn" data-filter="sky">Sky</button>
    <button class="filter-btn" data-filter="night">Night</button>
    <button class="filter-btn" data-filter="Portrait">Portrait</button>
</div>
             
             
<!-- GALLERY -->


        <section class="gallery" aria-label="Photography gallery">
 
        </section>


        <!-- light box -->

        <div class="lightbox" id="lightbox">

    <button class="lightbox-close" id="lightboxClose">
        &times;
    </button>

    <button class="lightbox-prev" id="lightboxPrev">
    &#10094;
</button>

<button class="lightbox-next" id="lightboxNext">
    &#10095;
</button>

    <img id="lightboxImage" src="" alt="">

    <div class="lightbox-caption">
        <h2 id="lightboxTitle"></h2>
        <p id="lightboxCategory"></p>
    </div>

</div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Through My Frames • All Rights Reserved.
        </p>

    </footer>


    <script src="Javascript/script.js"></script>

</body>

</html>
